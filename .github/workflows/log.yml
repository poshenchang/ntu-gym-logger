name: log

on:
  # Opening hours in Asia/Taipei (UTC+8), expressed in UTC:
  #   Mon–Fri 08:00–22:00 -> 00:00–14:00, Sat 09:00–22:00 -> 01:00–14:00, Sun 09:00–18:00 -> 01:00–10:00
  schedule:
    - cron: "*/10 0-13 * * 1-5"
    - cron: "*/10 1-13 * * 6"
    - cron: "*/10 1-9 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python log.py
      - run: python heatmap.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data.csv docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Taipei date '+%F %H:%M')"
          git pull --rebase --quiet
          git push
