name: log

on:
  # Started every 10 min during opening hours by an external cron service (cron-job.org)
  # calling the workflow_dispatch API; GitHub's own schedule: trigger never fired reliably.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Always start from the branch tip, so re-runs of old runs don't commit on a stale base.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python log.py
      - run: python heatmap.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data.csv docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Taipei date '+%F %H:%M')"
          git pull --rebase --quiet
          git push
